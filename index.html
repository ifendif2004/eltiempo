<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eltiempo. - Clima en España</title>
  <meta name="description" content="El tiempo en España en tiempo real. Pronóstico actual, por horas y semanal para cualquier municipio. Temperatura, viento, humedad, índice UV y más.">
  <meta name="keywords" content="tiempo, clima, España, meteorología, pronóstico, temperatura, lluvia, viento">
  <meta name="author" content="eltiempo.">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme Color (barra del navegador en Android) -->
  <meta name="theme-color" content="#1fa2ff">
  <meta name="msapplication-TileColor" content="#1fa2ff">
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

  <!-- iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eltiempo.">
  <link rel="apple-touch-icon" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72x72.png">
  <link rel="apple-touch-icon" sizes="96x96" href="icons/icon-96x96.png">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128x128.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">

  <!-- Favicon estándar -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72x72.png">

  <!-- Open Graph (compartir en redes sociales) -->
  <meta property="og:title" content="eltiempo. - Clima en España">
  <meta property="og:description" content="El tiempo en España en tiempo real. Pronóstico completo para cualquier municipio español.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/icon-512x512.png">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos Externos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CAPAS DE FONDO PARA TRANSICIÓN FLUIDA -->
  <div id="bg-clear-day" class="bg-layer bg-clear-day active"></div>
  <div id="bg-clear-night" class="bg-layer bg-clear-night"></div>
  <div id="bg-cloudy" class="bg-layer bg-cloudy"></div>
  <div id="bg-rainy" class="bg-layer bg-rainy"></div>
  <div id="bg-snowy" class="bg-layer bg-snowy"></div>
  <div id="bg-stormy" class="bg-layer bg-stormy"></div>

  <div class="app-container">
    
    <!-- HEADER -->
    <header>
      <div class="brand-section">
        <h1 class="logo">eltiempo<span>.</span></h1>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar tema claro/oscuro">
            <!-- Icono cargado dinámicamente por JS -->
          </button>
          <div id="current-date" class="date-badge">cargando fecha...</div>
        </div>
      </div>

      <!-- BUSCADOR Y SUGERENCIAS -->
      <div class="search-wrapper">
        <div class="search-box-container">
          <!-- Icono de lupa SVG -->
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Buscar municipio de España..." 
            autocomplete="off"
          >
          <!-- Sugerencias -->
          <div id="suggestions" class="suggestions-dropdown"></div>
        </div>
        
        <!-- Botón GPS -->
        <button id="gps-btn" class="gps-btn" title="Usar ubicación actual">
          <!-- Icono de Localización SVG -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </button>
      </div>

      <!-- ATAJOS DE CIUDADES -->
      <div id="quick-cities" class="quick-cities"></div>
    </header>

    <!-- MENSAJE DE ERROR -->
    <div id="error-message" class="error-message"></div>

    <!-- SECCIÓN CLIMA ACTUAL -->
    <main class="glass-card current-weather-card">
      <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
      </div>
      
      <div class="current-main">
        <div class="location-info">
          <h2 id="w-location" class="location-name">Cargando...</h2>
          <span id="w-admin" class="location-admin">provincia...</span>
          <span id="w-desc" class="weather-desc-badge">-</span>
        </div>

        <div class="temp-container">
          <div class="temp-section">
            <span id="w-temp" class="current-temp">--</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="temp-extremes">
            <span>Máx: <strong id="w-temp-max" class="temp-max">--°</strong></span>
            <span>Mín: <strong id="w-temp-min" class="temp-min">--°</strong></span>
          </div>
        </div>

        <div id="w-visual" class="current-visual">
          <!-- SVG dinámico cargado por JS -->
        </div>
      </div>

      <!-- CUADRÍCULA DE MÉTRICAS -->
      <div class="metrics-grid">
        <!-- Sensación Térmica -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
            <span>Sensación</span>
          </div>
          <span id="m-apparent" class="metric-value">--°C</span>
        </div>
        <!-- Humedad -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
            <span>Humedad</span>
          </div>
          <span id="m-humidity" class="metric-value">--%</span>
        </div>
        <!-- Lluvia / Precipitación -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"></path><path d="M8 16v6M12 16v6M16 16v6"></path></svg>
            <span>Lluvia</span>
          </div>
          <span id="m-precipitation" class="metric-value">-- mm</span>
        </div>
        <!-- Viento -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59-3.41A2 2 0 1 1 14 8H2m12.59 4.59A2 2 0 1 1 16 16H2"></path></svg>
            <span>Viento</span>
          </div>
          <span class="metric-value">
            <span id="m-wind">-- km/h</span>
            <span id="m-wind-dir" class="wind-dir-arrow">↑</span>
          </span>
        </div>
        <!-- Índice UV -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <span>Índice UV</span>
          </div>
          <span id="m-uv" class="metric-value">--</span>
        </div>
        <!-- Presión -->
        <div class="metric-card">
          <div class="metric-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
            <span>Presión</span>
          </div>
          <span id="m-pressure" class="metric-value">-- hPa</span>
        </div>
      </div>
    </main>

    <!-- PRONÓSTICO POR HORAS -->
    <section class="glass-card">
      <h3 class="section-title">Pronóstico Próximas Horas <span>(24 horas)</span></h3>
      <div id="hourly-forecast" class="hourly-forecast-container">
        <!-- Renderizado dinámico -->
      </div>
    </section>

    <!-- PRONÓSTICO 7 DÍAS -->
    <section class="glass-card">
      <h3 class="section-title">Pronóstico Semanal <span>(7 días)</span></h3>
      <div id="daily-forecast" class="daily-forecast-container">
        <!-- Renderizado dinámico -->
      </div>
    </section>

  </div>

  <!-- Lógica de Cliente -->
  <script src="script.js"></script>
</body>
</html>
